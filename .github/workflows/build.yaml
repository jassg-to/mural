name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      amd64:
        description: Build linux/amd64
        type: boolean
        default: false
      arm64:
        description: Build linux/arm64
        type: boolean
        default: true
      arm:
        description: Build linux/arm (v7)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Tag push — build all targets
            echo 'matrix={"include":[{"suffix":"amd64","goarch":"amd64"},{"suffix":"arm64","goarch":"arm64"},{"suffix":"arm","goarch":"arm","goarm":"7"}]}' >> "$GITHUB_OUTPUT"
          else
            # Manual dispatch — build selected targets
            include='[]'
            if [[ "${{ inputs.amd64 }}" == "true" ]]; then
              include=$(echo "$include" | jq -c '. + [{"suffix":"amd64","goarch":"amd64"}]')
            fi
            if [[ "${{ inputs.arm64 }}" == "true" ]]; then
              include=$(echo "$include" | jq -c '. + [{"suffix":"arm64","goarch":"arm64"}]')
            fi
            if [[ "${{ inputs.arm }}" == "true" ]]; then
              include=$(echo "$include" | jq -c '. + [{"suffix":"arm","goarch":"arm","goarm":"7"}]')
            fi
            echo "matrix={\"include\":$include}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm || '' }}
        run: go build -trimpath -ldflags="-s -w" -o mural_linux_${{ matrix.suffix }} .

      - uses: actions/upload-artifact@v7
        with:
          name: mural_linux_${{ matrix.suffix }}
          path: mural_linux_${{ matrix.suffix }}

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: mural_linux_*
